[package]
name = "zkschnorr"
version = "0.1.2"
authors = ["Usman Shahid"]
edition = "2021"
readme = "README.md"
# documentation = "https://github.com/twilight-project/zk-schnorr#readme"
license = "MIT"
repository = "https://github.com/twilight-project/zk-schnorr"
homepage = "https://github.com/twilight-project/zk-schnorr"
categories = ["cryptography", "algorithms"]
keywords = ["cryptography", "crypto", "signatures", "schnorr", "batch", "ristretto", "zero-knowledge"]
description = "A pure-Rust implementation of Multipoint Schnorr Signature Protocol using Ristretto (⚠️ Not audited - experimental use only)"
exclude = [
    "target/",
    ".git/",
    ".github/",
    "*.log"
]

[dependencies]
# Core cryptographic dependencies
curve25519-dalek = { version = "4", default-features = false, features = ["serde", "rand_core", "alloc"] }
merlin = { version = "3", default-features = false }

# Random number generation
rand = "0.8"
rand_core = { version = "0.6", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
thiserror = "1"

hex = "0.4"  # Only for Debug formatting in tests

[features]
default = []

[dev-dependencies]
# Add test-specific dependencies here if needed
# For example, if you add property-based testing:
# proptest = "1"
# quickcheck = "1"




[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"
